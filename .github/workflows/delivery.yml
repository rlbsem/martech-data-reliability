name: Operational delivery
on: [push, pull_request]
permissions: {contents: read}
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: true
jobs:
  service-acceptance:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env: {PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-operations.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/verify_delivery.py --workspace work/delivery --output work/delivery-evidence
      - run: python scripts/check_delivery.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: delivery-${{ matrix.os }}
          path: work/delivery-evidence/
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT_NAME: delivery-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Resolve and start the isolated deployment
        run: |
          mkdir -p work/container-evidence
          docker compose -f compose.yaml -f deploy/compose.acceptance.yaml config > work/container-evidence/resolved-compose.yaml
          docker compose -f compose.yaml -f deploy/compose.acceptance.yaml up --build -d --wait --wait-timeout 240
          docker image inspect "${COMPOSE_PROJECT_NAME}-console" > work/container-evidence/image.json
      - name: Audit the pinned application dependency against current advisories
        run: |
          python -m pip install pip-audit==2.9.0
          python -m pip_audit --no-deps --disable-pip -r requirements-runtime.lock --format json --output work/container-evidence/runtime-audit.json
      - name: Verify read-only mount and private network boundaries
        run: |
          docker compose exec -T console python -c "import os; assert os.getuid()==10001; assert not os.access('/state',os.W_OK); assert not os.path.exists('/control/controller.json')"
          docker compose exec -T console python -m reliability_ops.verify --config /console-config/console.json
          curl --fail http://127.0.0.1:8602/readyz > work/container-evidence/initial-readiness.json
      - name: Real container failure, restart and backup acceptance
        run: |
          docker compose -f compose.yaml -f deploy/compose.acceptance.yaml run --rm maintenance backup --config /console-config/console.json --archive /backups/run01
          docker compose -f compose.yaml -f deploy/compose.acceptance.yaml run --rm maintenance restore --config /console-config/console.json --archive /backups/run01 --target /backups/restored
          docker compose stop website
          test "$(curl -s -o work/container-evidence/source-outage.json -w '%{http_code}' http://127.0.0.1:8602/readyz)" = 503
          curl --fail http://127.0.0.1:8602/livez
          docker compose -f compose.yaml -f deploy/compose.acceptance.yaml up -d website
          docker compose restart console
          sleep 3
          curl --fail --retry 10 --retry-all-errors --retry-delay 2 http://127.0.0.1:8602/readyz > work/container-evidence/recovered-readiness.json
      - name: Preserve bounded service logs and actual container configuration
        if: always()
        run: |
          docker compose logs --no-color > work/container-evidence/service.log
          docker compose ps -a --format json > work/container-evidence/services.json
          for id in $(docker compose ps -aq); do docker inspect "$id"; done > work/container-evidence/containers.json
      - name: Teardown and independent residual check
        if: always()
        run: |
          docker compose -f compose.yaml -f deploy/compose.acceptance.yaml --profile maintenance down --volumes --remove-orphans --timeout 20
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker network ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          echo '{"project_containers":0,"project_volumes":0,"project_networks":0}' > work/container-evidence/teardown.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: container-delivery
          path: work/container-evidence/
