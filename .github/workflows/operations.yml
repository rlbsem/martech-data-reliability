name: Multi-source operations
on: [push, pull_request]
permissions: {contents: read}
concurrency:
  group: operations-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    strategy:
      fail-fast: false
      matrix: {os: [ubuntu-latest, windows-latest]}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env: {PYTHONUTF8: '1'}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements-operations.lock
      - run: python -m pip install --no-deps --no-build-isolation -e .
      - run: python -m playwright install chromium
      - run: python scripts/verify_operations.py --workspace work/native --output work/native-evidence
      - name: Current committed evidence gate
        run: python scripts/check_operations.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: operations-${{ matrix.os }}
          path: work/native-evidence/
  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: reliability-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - run: docker compose config --quiet
      - run: docker compose up --build -d --wait --wait-timeout 180
      - run: docker compose exec -T console python -m reliability_ops.verify --config /console-config/console.json
      - run: python -m pip install -r requirements-operations.lock
      - run: python -m playwright install chromium
      - run: python scripts/browser_operations.py --url http://127.0.0.1:8602/ --output work/compose-browser
      - name: Record service status
        if: always()
        run: |
          mkdir -p work/compose-checks
          docker compose ps -a --format json > work/compose-checks/services.json
      - name: Teardown and independent project resource check
        if: always()
        run: |
          docker compose down --volumes --remove-orphans --timeout 20
          test -z "$(docker ps -aq --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker volume ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
          test -z "$(docker network ls -q --filter label=com.docker.compose.project=$COMPOSE_PROJECT_NAME)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: compose-browser-and-status
          path: |
            work/compose-browser/
            work/compose-checks/
